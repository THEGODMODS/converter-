name: Windows quality
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: face-forge-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm audit --audit-level=high
      - run: cargo test --manifest-path native/Cargo.toml
      - name: Test pinned upstream PES conversion engine
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP 'unlimited-tool-works'
          git clone --filter=blob:none --no-checkout https://github.com/the4chancup/unlimited-tool-works.git $upstream
          git -C $upstream checkout ca4fe4a32500ffc2d932a1a669a42a6f932d571a
          cargo test --manifest-path (Join-Path $upstream 'Cargo.toml') -p model_convert -p fpk -p ftex
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run dist:win
      - run: node scripts/verify-release-installer.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: face-forge-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
