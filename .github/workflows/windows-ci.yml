name: Windows quality
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: face-forge-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run dist:win
      - run: node scripts/verify-release-installer.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: face-forge-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
