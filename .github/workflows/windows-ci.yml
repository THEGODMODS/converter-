name: Windows quality
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: face-forge-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm audit --audit-level=high
      - run: cargo test --manifest-path native/Cargo.toml
      - name: Test pinned upstream PES conversion engine
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP 'unlimited-tool-works'
          git clone --filter=blob:none --no-checkout https://github.com/the4chancup/unlimited-tool-works.git $upstream
          git -C $upstream checkout ca4fe4a32500ffc2d932a1a669a42a6f932d571a
          cargo test --manifest-path (Join-Path $upstream 'Cargo.toml') -p model_convert -p fpk -p ftex -p team_compiler -p studio_core
      - name: Verify incomplete upstream archive is rejected safely
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstream = Join-Path $env:RUNNER_TEMP 'unlimited-tool-works'
          $fixture = Join-Path $upstream 'crates/tools/team_compiler/tests/fixtures/tracer/red/Asset/model/character/face/real/79205/#Win'
          $input = Join-Path $env:RUNNER_TEMP 'face-forge-incomplete-fixture'
          $output = Join-Path $env:RUNNER_TEMP 'face-forge-rejected-output'
          if (!(Test-Path (Join-Path $fixture 'face.fpk')) -or !(Test-Path (Join-Path $fixture 'face.fpkd'))) { throw 'Pinned upstream archive fixture is incomplete.' }
          if (Test-Path $input) { Remove-Item $input -Recurse -Force }
          if (Test-Path $output) { Remove-Item $output -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $input,$output | Out-Null
          Copy-Item (Join-Path $fixture 'face.fpk') $input
          Copy-Item (Join-Path $fixture 'face.fpkd') $input
          $diagnostic = & cargo run --quiet --manifest-path native/Cargo.toml -- convert-face-folder --input $input --target 2017 --player-id 79205 --out $output 2>&1
          $exit = $LASTEXITCODE
          $message = $diagnostic -join "`n"
          if ($exit -eq 0) { throw 'FACE FORGE accepted an upstream fixture that contains no face_high.fmdl; this must fail closed.' }
          if ($message -notmatch 'face_high\.fmdl') { throw "FACE FORGE failed for an unexpected reason: $message" }
          if (@(Get-ChildItem -Path $output -Filter '*.cpk' -File).Count -gt 0) { throw 'FACE FORGE left a partial CPK after rejecting the incomplete source.' }
          'Confirmed: the pinned upstream 79205 archive is a hair-only/incomplete fixture and is rejected without publishing output.'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run dist:win
      - run: node scripts/verify-release-installer.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: face-forge-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
